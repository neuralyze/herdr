name: Maintained Herdr validation

# Install as .github/workflows/maintenance-check.yml in neuralyze/herdr after
# pinning both reuse and tool checkout to the same trusted 40-hex tool commit.
# The updater explicitly dispatches this file at its candidate branch because
# GITHUB_TOKEN-created PR events do not reliably start PR-triggered workflows.
on:
  pull_request:
    branches: [maintained]
  push:
    branches: [maintained]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'neuralyze/herdr'
    uses: neuralyze/herdr-maintenance/.github/workflows/component-check.yml@37bb948a0ea8aa0f8ddd02f609d5ddcf42e05d97
    with:
      product: herdr
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # github.workflow_sha is this caller, NOT the reusable tool commit.
      tool_ref: '37bb948a0ea8aa0f8ddd02f609d5ddcf42e05d97'
